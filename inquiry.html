<header>

      <img src="https://assets.codepen.io/296057/logo-nav.png" class="logo" alt="logo" />

    </div>

    <nav>
      <ul>

      </ul>
    </nav>

  </header>
 
<div class="container">
  <form id="form">

    <!-- Basic Info Section -->
    <div class="basic-info">
      <label for="name">Your Name</label>
      <input type="text" name="yourname" id="name" required>

      <label for="mail">Email:</label>
      <input type="email" id="mail" name="user_email" required>

      <label for="phone">Phone:</label>
      <input type="tel" id="phone" name="phone">
    </div>

    <!-- Comments Section -->
    <div class="text-area">
      <label for="excited">Comments</label>
      <textarea id="excited" name="excited"></textarea>

      <!-- Dropdown -->
      <label for="dropdown">Choose a coffee flavor:</label>
      <select id="dropdown" name="coffee">
        <option value="caramel">Caramel</option>
        <option value="frenchvanilla">French Vanilla</option>
        <option value="hazelnut">Hazelnut</option>
      </select>

      <!-- Radio buttons -->
      <p>Choose one:</p>
      <label>
        <input type="radio" name="choice" value="Buy Coffee" required>
        Buy Coffee
      </label>
      <label>
        <input type="radio" name="choice" value="Job Application">
        Job Application
      </label>

      <button type="submit">Submit</button>
    </div>

  </form>
</div>

<!-- JS goes LAST -->
