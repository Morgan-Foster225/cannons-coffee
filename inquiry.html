<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/latte.css">
 <link rel="stylesheet" href="inquiry.html">

</head>
<body>
<!-- FORM SECTION -->
<div class="container">
  <form id="form">
    
    <!-- Basic Info Section -->
    <div class="basic-info">
      <label for="name">Your Name</label>
      <input type="text" id="name" placeholder="Jane Doe" required>

      <label for="mail">Email:</label>
      <input type="email" id="mail" required>

      <label for="phone">Phone:</label>
      <input type="tel" id="phone" placeholder="123-456-7890">
    </div>

    <!-- Comments Section -->
    <div class="text-area">
      <label for="excited">Comments</label>
      <textarea id="excited" rows="4" cols="40"></textarea>

      <!-- Dropdown -->
      <label for="dropdown">Choose a coffee flavor:</label>
      <select id="dropdown">
        <option value="caramel">Caramel</option>
        <option value="frenchvanilla">French Vanilla</option>
        <option value="hazelnut">Hazelnut</option>
      </select>

      <!-- Radio Buttons -->
      <p>Choose one:</p>
      <label>
        <input type="radio" name="choice" required> Buy Coffee
      </label>
      <label>
        <input type="radio" name="choice"> Job Application
      </label>

      <button type="submit">Submit</button>
    </div>

  </form>
</div>

</body>
</html>
